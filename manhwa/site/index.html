<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhwa Updates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f0; --surface: #ffffff; --surface2: #efece6; --border: #e0dbd2;
    --text: #1c1a17; --muted: #6f685d; --accent: #d9481c; --accent-soft: #fbe6dd;
    --new: #2f7d4f; --new-soft: #dcefe3; --star: #e0a100;
    --font: 'DM Sans', system-ui, sans-serif; --mono: 'DM Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121110; --surface: #1c1a18; --surface2: #262320; --border: #34302b;
      --text: #ece7df; --muted: #9a9286; --accent: #ff7a4d; --accent-soft: #3a2219;
      --new: #6fcf97; --new-soft: #1d3326; --star: #ffc93c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121110; --surface: #1c1a18; --surface2: #262320; --border: #34302b;
    --text: #ece7df; --muted: #9a9286; --accent: #ff7a4d; --accent-soft: #3a2219;
    --new: #6fcf97; --new-soft: #1d3326; --star: #ffc93c;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 8px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .sub a { color: var(--muted); }
  .warn { margin-top: 8px; font-size: 13px; color: var(--accent); }

  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 28px 0 12px; }
  .trend { display: grid; grid-auto-flow: column; grid-auto-columns: 112px; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
  .trend a { text-decoration: none; font-size: 12px; line-height: 1.3; }
  .trend img { width: 112px; height: 160px; object-fit: cover; border-radius: 8px; background: var(--surface2); display: block; margin-bottom: 6px; }
  .trend .score { color: var(--muted); font-family: var(--mono); }

  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); }
  .tabs { display: flex; background: var(--surface2); border-radius: 999px; padding: 3px; }
  .tabs button { border: 0; background: none; color: var(--muted); font: 500 13px var(--font); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  input, select { font: 14px var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
  input[type=search] { flex: 1 1 200px; min-width: 0; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  .list { display: grid; gap: 12px; padding: 16px 0 48px; }
  .card { display: grid; grid-template-columns: 76px 1fr; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .card img { width: 76px; height: 108px; object-fit: cover; border-radius: 6px; background: var(--surface2); }
  .top { display: flex; gap: 8px; align-items: flex-start; }
  .title { font-weight: 700; font-size: 16px; line-height: 1.3; flex: 1; text-decoration: none; }
  .star { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--border); padding: 0 2px; }
  .star[aria-pressed="true"] { color: var(--star); }
  .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--new-soft); color: var(--new); }
  .ch { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; font-size: 13.5px; padding: 3px 0; }
  .ch b { font-family: var(--mono); font-weight: 400; min-width: 64px; }
  .ch time { color: var(--muted); font-size: 12px; min-width: 52px; }
  .rel { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface2); text-decoration: none; white-space: nowrap; }
  .rel:hover { background: var(--accent-soft); }
  .more { font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 0; font-family: var(--font); text-decoration: underline; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .links a { font-size: 12px; text-decoration: none; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); }
  .links a.off { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 12px; padding: 0 0 32px; }
  @media (max-width: 520px) {
    .card { grid-template-columns: 56px 1fr; }
    .card img { width: 56px; height: 80px; }
    .count { width: 100%; margin: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Manhwa <span>Updates</span></h1>
    <p class="sub" id="sub">Loading…</p>
    <p class="warn" id="warn" hidden></p>
  </header>

  <h2>Trending on AniList</h2>
  <div class="trend" id="trend"></div>

  <div class="controls">
    <div class="tabs" role="group" aria-label="Show">
      <button data-tab="all" aria-pressed="true">All</button>
      <button data-tab="following" aria-pressed="false">★ Following</button>
      <button data-tab="new" aria-pressed="false">New series</button>
    </div>
    <input type="search" id="q" placeholder="Search titles or groups…" aria-label="Search">
    <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
    <select id="since" aria-label="Updated within">
      <option value="1">Last 24 hours</option>
      <option value="3">Last 3 days</option>
      <option value="7" selected>Last 7 days</option>
      <option value="999">Everything</option>
    </select>
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list"></div>
  <footer>
    Combined from <a href="https://www.mangaupdates.com/releases.html">MangaUpdates</a>,
    <a href="https://mangadex.org">MangaDex</a> and <a href="https://anilist.co">AniList</a>.
    Orange buttons go to official publishers; reading there supports the creators.
    Follows are saved in this browser only.
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = { series: [], trending: [] };
let follows = new Set(store.get("follows", []));
const state = { tab: store.get("tab", "all"), q: "", genre: "", since: store.get("since", "7") };
const expanded = new Set();

function ago(iso) {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 60) return `${Math.max(1, Math.round(m))}m`;
  if (m < 1440) return `${Math.round(m / 60)}h`;
  return `${Math.round(m / 1440)}d`;
}
function chapterLabel(c) {
  if (!c.chapter) return c.volume ? `Vol ${c.volume}` : "Oneshot";
  return (c.volume ? `v${c.volume} ` : "") + `Ch ${c.chapter}`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const cutoff = Date.now() - Number(state.since) * 864e5;
  const shown = data.series.filter((s) => {
    if (state.tab === "following" && !follows.has(s.key)) return false;
    if (state.tab === "new" && !s.is_new) return false;
    if (state.genre && !s.genres.includes(state.genre)) return false;
    if (new Date(s.latest) < cutoff) return false;
    if (q && !s.title.toLowerCase().includes(q) && !s.chapters.some((c) => c.releases.some((r) => r.group.toLowerCase().includes(q)))) return false;
    return true;
  });
  $("count").textContent = `${shown.length} series`;

  if (!shown.length) {
    $("list").innerHTML = `<p class="empty">${state.tab === "following" && !follows.size
      ? "Tap ☆ on any series to follow it. Followed series show up here."
      : "Nothing matches these filters."}</p>`;
    return;
  }

  $("list").innerHTML = shown.slice(0, 300).map((s) => {
    const open = expanded.has(s.key);
    const chs = open ? s.chapters : s.chapters.slice(0, 3);
    const main = s.official[0]?.url || s.links.MangaUpdates || s.links.MangaDex || s.links.AniList || "#";
    const meta = [
      s.is_new ? `<span class="badge">NEW SERIES</span>` : "",
      s.score ? `AniList ${s.score}%` : "",
      s.rating ? `MU ${s.rating.toFixed(1)}` : "",
      s.status ? esc(s.status) : "",
      s.genres.slice(0, 4).map(esc).join(" · "),
    ].filter(Boolean).join("<span aria-hidden>·</span>");
    return `<article class="card">
      <a href="${esc(main)}" target="_blank" rel="noopener">${s.cover ? `<img src="${esc(s.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<img alt="">`}</a>
      <div>
        <div class="top">
          <a class="title" href="${esc(main)}" target="_blank" rel="noopener">${esc(s.title)}</a>
          <button class="star" data-key="${esc(s.key)}" aria-pressed="${follows.has(s.key)}" aria-label="Follow">${follows.has(s.key) ? "★" : "☆"}</button>
        </div>
        <div class="meta">${meta}</div>
        ${chs.map((c) => `<div class="ch"><b>${esc(chapterLabel(c))}</b><time datetime="${c.time}" title="${new Date(c.time).toLocaleString()}">${ago(c.time)} ago</time>
          ${c.releases.map((r) => `<a class="rel" href="${esc(r.url)}" target="_blank" rel="noopener" title="via ${esc(r.source)}">${esc(r.group || r.source)}</a>`).join("")}</div>`).join("")}
        ${s.chapters.length > 3 ? `<button class="more" data-more="${esc(s.key)}">${open ? "Show less" : `+${s.chapters.length - 3} more chapters`}</button>` : ""}
        <div class="links">
          ${s.official.slice(0, 3).map((l) => `<a class="off" href="${esc(l.url)}" target="_blank" rel="noopener">Read on ${esc(l.site)}</a>`).join("")}
          ${Object.entries(s.links).map(([k, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${k}</a>`).join("")}
        </div>
      </div>
    </article>`;
  }).join("");
}

function setTab(tab) {
  state.tab = tab;
  store.set("tab", tab);
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  render();
}

document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("genre").addEventListener("change", (e) => { state.genre = e.target.value; render(); });
$("since").addEventListener("change", (e) => { state.since = e.target.value; store.set("since", state.since); render(); });
$("list").addEventListener("click", (e) => {
  const star = e.target.closest(".star");
  if (star) {
    const k = star.dataset.key;
    follows.has(k) ? follows.delete(k) : follows.add(k);
    store.set("follows", [...follows]);
    render();
  }
  const more = e.target.closest("[data-more]");
  if (more) {
    const k = more.dataset.more;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    render();
  }
});

fetch("data.json").then((r) => r.json()).then((d) => {
  data = d;
  const total = d.series.reduce((n, s) => n + s.chapters.length, 0);
  $("sub").innerHTML = `${d.series.length} series · ${total} chapters in the last ${d.keep_days} days · updated ${ago(d.updated)} ago`;
  const failed = Object.entries(d.sources || {}).filter(([, v]) => v !== "ok");
  if (failed.length) { $("warn").hidden = false; $("warn").textContent = "Last refresh had problems: " + failed.map(([k, v]) => `${k} (${v})`).join(", "); }

  const genres = [...new Set(d.series.flatMap((s) => s.genres))].sort();
  $("genre").insertAdjacentHTML("beforeend", genres.map((g) => `<option>${esc(g)}</option>`).join(""));
  $("since").value = state.since;

  $("trend").innerHTML = d.trending.map((t) => `<a href="${esc(t.official[0]?.url || t.url)}" target="_blank" rel="noopener">
    <img src="${esc(t.cover)}" alt="" loading="lazy">${esc(t.title)}${t.score ? `<div class="score">${t.score}%</div>` : ""}</a>`).join("");
  setTab(state.tab);
}).catch(() => { $("sub").textContent = "Couldn't load data.json."; });
</script>
</body>
</html>
